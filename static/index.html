<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fafafa;
    color: #1a1a1a;
  }
  header {
    padding: 0.75rem 1rem;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    max-width: 85%;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { background: #2b6cb0; color: #fff; margin-left: auto; border-bottom-right-radius: 0.25rem; }
  .assistant { background: #fff; border: 1px solid #e5e5e5; border-bottom-left-radius: 0.25rem; }
  .assistant.error { color: #c53030; }
  .cursor::after {
    content: "▍";
    margin-left: 2px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  footer {
    padding: 0.75rem 1rem 1rem;
    background: #fff;
    border-top: 1px solid #e5e5e5;
  }
  .input-row {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    padding: 0.625rem 0.875rem;
    border: 1px solid #d4d4d4;
    border-radius: 0.625rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    max-height: 200px;
    line-height: 1.5;
  }
  #input:focus { outline: none; border-color: #2b6cb0; }
  button {
    padding: 0.625rem 1.25rem;
    border: none;
    border-radius: 0.625rem;
    background: #2b6cb0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #2c5282; }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: #4a5568;
    border: 1px solid #cbd5e0;
    padding: 0.4rem 0.85rem;
    font-size: 0.875rem;
  }
  button.secondary:hover:not(:disabled) { background: #f7fafc; color: #1a1a1a; }
  .empty {
    text-align: center;
    color: #a0aec0;
    margin-top: 4rem;
    font-size: 0.95rem;
  }
</style>
</head>
<body>
<header>
  <h1>Claude Chat</h1>
  <button class="secondary" id="reset">Reset</button>
</header>
<div id="messages">
  <div class="empty">Start a conversation below.</div>
</div>
<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder="Type a message... (Enter to send, Shift+Enter for newline)"></textarea>
    <button id="send">Send</button>
  </div>
</footer>
<script>
const messages = [];
const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');

function clearEmpty() {
  const empty = messagesEl.querySelector('.empty');
  if (empty) empty.remove();
}

function addBubble(role, text) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  sendBtn.textContent = busy ? 'Sending...' : 'Send';
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetBtn.addEventListener('click', () => {
  messages.length = 0;
  messagesEl.innerHTML = '<div class="empty">Start a conversation below.</div>';
  input.focus();
});

sendBtn.addEventListener('click', send);

async function send() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  setBusy(true);

  messages.push({ role: 'user', content: text });
  addBubble('user', text);

  const assistantEl = addBubble('assistant', '');
  assistantEl.classList.add('cursor');
  let acc = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const evt of events) {
        if (!evt.startsWith('data: ')) continue;
        const data = JSON.parse(evt.slice(6));
        if (data.text) {
          acc += data.text;
          assistantEl.textContent = acc;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        } else if (data.error) {
          assistantEl.textContent = '[' + data.error + ']';
          assistantEl.classList.add('error');
        }
      }
    }

    if (acc && !assistantEl.classList.contains('error')) {
      messages.push({ role: 'assistant', content: acc });
    } else if (!acc) {
      // Pop the user message on hard error so they can retry
      messages.pop();
    }
  } catch (e) {
    assistantEl.textContent = '[Connection error: ' + e.message + ']';
    assistantEl.classList.add('error');
    messages.pop();
  } finally {
    assistantEl.classList.remove('cursor');
    setBusy(false);
    input.focus();
  }
}

input.focus();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude Chat with Tools</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: #fafafa;
    color: #1a1a1a;
  }
  header {
    padding: 0.75rem 1rem;
    background: #fff;
    border-bottom: 1px solid #e5e5e5;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 { margin: 0; font-size: 1.05rem; font-weight: 600; }
  header .subtitle { font-size: 0.8rem; color: #718096; margin-left: 0.5rem; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 1.5rem 1rem;
    max-width: 800px;
    width: 100%;
    margin: 0 auto;
  }
  .msg {
    margin-bottom: 1rem;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    max-width: 85%;
    line-height: 1.55;
    white-space: pre-wrap;
    word-wrap: break-word;
  }
  .user { background: #2b6cb0; color: #fff; margin-left: auto; border-bottom-right-radius: 0.25rem; }
  .assistant { background: #fff; border: 1px solid #e5e5e5; border-bottom-left-radius: 0.25rem; }
  .assistant.error { color: #c53030; }
  .cursor::after {
    content: "▍";
    margin-left: 2px;
    animation: blink 1s infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .tool {
    margin: 0.5rem 0 0.5rem 0.5rem;
    border: 1px solid #cbd5e0;
    border-radius: 0.5rem;
    max-width: 85%;
    background: #f7fafc;
    overflow: hidden;
    font-size: 0.85rem;
  }
  .tool-header {
    padding: 0.4rem 0.75rem;
    background: #edf2f7;
    cursor: pointer;
    user-select: none;
    display: flex;
    gap: 0.5rem;
    align-items: center;
    border-bottom: 1px solid transparent;
  }
  .tool.open .tool-header { border-bottom-color: #cbd5e0; }
  .tool-arrow {
    display: inline-block;
    transition: transform 0.15s;
    color: #718096;
    font-size: 0.7rem;
  }
  .tool.open .tool-arrow { transform: rotate(90deg); }
  .tool-name {
    font-weight: 600;
    color: #2b6cb0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .tool-summary {
    color: #4a5568;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  .tool-status {
    font-size: 0.75rem;
    padding: 0.1rem 0.45rem;
    border-radius: 0.75rem;
    background: #e6fffa;
    color: #234e52;
  }
  .tool-status[data-status="pending"] { background: #fef5e7; color: #7b341e; }
  .tool-status[data-status="error"] { background: #fed7d7; color: #742a2a; }
  .tool-body {
    display: none;
    padding: 0.6rem 0.75rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem;
  }
  .tool.open .tool-body { display: block; }
  .tool-section-label {
    font-weight: 600;
    color: #718096;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.25rem;
  }
  .tool-input, .tool-result-text {
    background: #fff;
    padding: 0.5rem;
    border-radius: 0.25rem;
    border: 1px solid #e2e8f0;
    white-space: pre-wrap;
    word-break: break-word;
    color: #2d3748;
    margin-bottom: 0.5rem;
    max-height: 240px;
    overflow-y: auto;
  }
  .tool-result-text:last-child { margin-bottom: 0; }
  .tool-result-text.error { color: #c53030; border-color: #feb2b2; }
  footer {
    padding: 0.75rem 1rem 1rem;
    background: #fff;
    border-top: 1px solid #e5e5e5;
  }
  .input-row {
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    gap: 0.5rem;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    padding: 0.625rem 0.875rem;
    border: 1px solid #d4d4d4;
    border-radius: 0.625rem;
    font-size: 0.95rem;
    font-family: inherit;
    resize: none;
    max-height: 200px;
    line-height: 1.5;
  }
  #input:focus { outline: none; border-color: #2b6cb0; }
  button {
    padding: 0.625rem 1.25rem;
    border: none;
    border-radius: 0.625rem;
    background: #2b6cb0;
    color: #fff;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
  }
  button:hover:not(:disabled) { background: #2c5282; }
  button:disabled { background: #a0aec0; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: #4a5568;
    border: 1px solid #cbd5e0;
    padding: 0.4rem 0.85rem;
    font-size: 0.875rem;
  }
  button.secondary:hover:not(:disabled) { background: #f7fafc; color: #1a1a1a; }
  .empty {
    text-align: center;
    color: #a0aec0;
    margin-top: 4rem;
    font-size: 0.95rem;
  }
  .empty .tools-hint {
    margin-top: 0.5rem;
    font-size: 0.8rem;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
</style>
</head>
<body>
<header>
  <h1>Claude Chat <span class="subtitle">with file system tools</span></h1>
  <button class="secondary" id="reset">Reset</button>
</header>
<div id="messages">
  <div class="empty">
    Ask about files in the workspace.
    <div class="tools-hint">tools: list_directory · read_file · search_files · get_current_time · calculate</div>
  </div>
</div>
<footer>
  <div class="input-row">
    <textarea id="input" rows="1" placeholder='Try: "How many Python files are here?" or "Read agent.py and explain what it does"'></textarea>
    <button id="send">Send</button>
  </div>
</footer>
<script>
const messages = [];
const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const resetBtn = document.getElementById('reset');

let currentAssistantEl = null;
const toolEls = new Map();

function clearEmpty() {
  const empty = messagesEl.querySelector('.empty');
  if (empty) empty.remove();
}

function scrollDown() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  sendBtn.textContent = busy ? 'Sending...' : 'Send';
}

function addUserBubble(text) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'msg user';
  div.textContent = text;
  messagesEl.appendChild(div);
  scrollDown();
}

function ensureAssistantBubble() {
  if (!currentAssistantEl) {
    clearEmpty();
    currentAssistantEl = document.createElement('div');
    currentAssistantEl.className = 'msg assistant cursor';
    messagesEl.appendChild(currentAssistantEl);
  }
  return currentAssistantEl;
}

function appendAssistantText(text) {
  const el = ensureAssistantBubble();
  el.textContent += text;
  scrollDown();
}

function finishAssistantBubble() {
  if (currentAssistantEl) {
    currentAssistantEl.classList.remove('cursor');
    if (!currentAssistantEl.textContent) {
      currentAssistantEl.remove();
    }
    currentAssistantEl = null;
  }
}

function summarizeInput(input) {
  const json = JSON.stringify(input);
  return json.length > 80 ? json.slice(0, 77) + '...' : json;
}

function addToolWidget(id, name, toolInput) {
  finishAssistantBubble();
  clearEmpty();

  const wrap = document.createElement('div');
  wrap.className = 'tool';

  const header = document.createElement('div');
  header.className = 'tool-header';
  header.innerHTML = `
    <span class="tool-arrow">▶</span>
    <span class="tool-name">${name}</span>
    <span class="tool-summary"></span>
    <span class="tool-status" data-status="pending">running</span>
  `;
  header.querySelector('.tool-summary').textContent = summarizeInput(toolInput);
  header.addEventListener('click', () => wrap.classList.toggle('open'));

  const body = document.createElement('div');
  body.className = 'tool-body';
  body.innerHTML = `
    <div class="tool-section-label">input</div>
    <div class="tool-input"></div>
    <div class="tool-section-label">result</div>
    <div class="tool-result-text" data-pending="1">waiting for execution...</div>
  `;
  body.querySelector('.tool-input').textContent = JSON.stringify(toolInput, null, 2);

  wrap.appendChild(header);
  wrap.appendChild(body);
  messagesEl.appendChild(wrap);
  toolEls.set(id, wrap);
  scrollDown();
}

function fillToolResult(id, content, isError) {
  const wrap = toolEls.get(id);
  if (!wrap) return;
  const resultEl = wrap.querySelector('.tool-result-text');
  resultEl.textContent = content;
  resultEl.removeAttribute('data-pending');
  if (isError) resultEl.classList.add('error');
  const status = wrap.querySelector('.tool-status');
  status.dataset.status = isError ? 'error' : 'ok';
  status.textContent = isError ? 'error' : 'done';
}

function showError(message) {
  finishAssistantBubble();
  const div = document.createElement('div');
  div.className = 'msg assistant error';
  div.textContent = '[' + message + ']';
  messagesEl.appendChild(div);
  scrollDown();
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 200) + 'px';
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

resetBtn.addEventListener('click', () => {
  messages.length = 0;
  toolEls.clear();
  currentAssistantEl = null;
  messagesEl.innerHTML = `
    <div class="empty">
      Ask about files in the workspace.
      <div class="tools-hint">tools: list_directory · read_file · search_files · get_current_time · calculate</div>
    </div>
  `;
  input.focus();
});

sendBtn.addEventListener('click', send);

async function send() {
  const text = input.value.trim();
  if (!text) return;

  input.value = '';
  input.style.height = 'auto';
  setBusy(true);

  messages.push({ role: 'user', content: text });
  addUserBubble(text);

  let accumulated = '';
  let hardError = false;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages }),
    });

    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });

      const events = buffer.split('\n\n');
      buffer = events.pop();

      for (const evt of events) {
        if (!evt.startsWith('data: ')) continue;
        const data = JSON.parse(evt.slice(6));

        switch (data.type) {
          case 'text':
            accumulated += data.text;
            appendAssistantText(data.text);
            break;
          case 'tool_use':
            addToolWidget(data.id, data.name, data.input);
            break;
          case 'tool_result':
            fillToolResult(data.tool_use_id, data.content, data.is_error);
            break;
          case 'done':
            finishAssistantBubble();
            break;
          case 'error':
            showError(data.error);
            hardError = true;
            break;
        }
      }
    }

    finishAssistantBubble();

    if (accumulated && !hardError) {
      messages.push({ role: 'assistant', content: accumulated });
    } else {
      messages.pop();
    }
  } catch (e) {
    showError('Connection error: ' + e.message);
    messages.pop();
  } finally {
    setBusy(false);
    input.focus();
  }
}

input.focus();
</script>
</body>
</html>
